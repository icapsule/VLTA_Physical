name: 🛡️ Supabase Database Keep-Alive & 7-Day Backup

on:
  schedule:
    # 每天北京时间凌晨 02:00 运行 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 支持在 GitHub Web 界面一键手动触发

jobs:
  keep-alive:
    name: ⚡ 数据库活性能量包打卡 (Keep Alive)
    runs-on: ubuntu-latest
    steps:
      - name: 发起真实数据库 REST API 查询打卡
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://xibqavywcafplnqwbsae.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_mFHeoHWvMJUvoPgrC5-gmQ_Xm5ROj4g}"

          echo "正在向 Supabase 真实 profiles 数据表发起 SQL 查询打卡..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "${URL}/rest/v1/profiles?select=count" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          
          echo "Supabase 响应状态码: $HTTP_STATUS"
          echo "数据库查询结果: $BODY"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ 保活成功！已成功触发数据库 profiles 表真实查询事务，活性倒计时已重置！"
            exit 0
          else
            echo "❌ 接口返回异常状态码: $HTTP_STATUS"
            exit 1
          fi

  daily-backup:
    name: 📦 数据库 7 天滚动数据备份 (7-Day Retention Backup)
    runs-on: ubuntu-latest
    steps:
      - name: 导出数据库全量 JSON/SQL 数据快照
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://xibqavywcafplnqwbsae.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_mFHeoHWvMJUvoPgrC5-gmQ_Xm5ROj4g}"

          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          FILENAME="vlta_backup_${TIMESTAMP}.json"

          echo "正在导出 profiles 及核心数据快照..."
          
          curl -s "${URL}/rest/v1/profiles?select=*" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" > "$FILENAME"

          echo "压缩数据备份包..."
          gzip "$FILENAME"

          echo "BACKUP_FILE_GZ=${FILENAME}.gz" >> $GITHUB_ENV

      - name: 上传备份至 GitHub Artifacts (严格保存 7 天)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE_GZ }}
          retention-days: 7 # 7 天自动轮转销毁旧快照
